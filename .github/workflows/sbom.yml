name: SBOM

# Produce a CycloneDX software bill of materials for the only executable
# artefact in this repository (the illustrative Python simulation) and attach it
# to tagged releases. A release without an SBOM is treated as incomplete.

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: sbom-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    cyclonedx:
        name: CycloneDX SBOM
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"
            - name: Install CycloneDX generator
              run: python3 -m pip install --disable-pip-version-check "cyclonedx-bom==6.1.1"
            - name: Generate SBOM from pinned requirements
              working-directory: Algorithms/Swarm-EWS-Simulation
              run: cyclonedx-py requirements -i requirements.txt -o sbom.cdx.json --of json
            - name: Validate SBOM
              working-directory: Algorithms/Swarm-EWS-Simulation
              run: |
                  python3 - <<'PY'
                  import json
                  with open("sbom.cdx.json", encoding="utf-8") as handle:
                      document = json.load(handle)
                  assert document["bomFormat"] == "CycloneDX", "not a CycloneDX document"
                  print(f"valid CycloneDX {document['specVersion']} "
                        f"with {len(document.get('components', []))} components")
                  PY
            - name: Upload SBOM artefact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: sbom-cyclonedx
                  path: Algorithms/Swarm-EWS-Simulation/sbom.cdx.json
                  retention-days: 90

    attach-to-release:
        name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: cyclonedx
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Download SBOM
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: sbom-cyclonedx
            - name: Publish release with SBOM
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  files: sbom.cdx.json
                  generate_release_notes: true
